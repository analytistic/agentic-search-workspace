[project]
name = "isp"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "pyarrow>=26.0.1",
    "ray>=2.60.0",
    "torch>=2.15.0",
    "transformers>=5.23.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
cpu = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isp"]
