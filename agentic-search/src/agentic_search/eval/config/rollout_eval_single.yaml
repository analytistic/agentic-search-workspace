# 单轮检索器：tool_agent 循环，只允许 1 轮 search，然后回答。
# 用法：python3 rollout_eval.py --config-name rollout_eval_single

hydra:
  searchpath:
    - file://${oc.env:WORKSPACE,./}/verl/verl/trainer/config

defaults:
  - rollout_eval_base
  - _self_

mode: single

actor_rollout_ref:
  rollout:
    agent:
      default_agent_loop: tool_agent
    multi_turn:
      max_assistant_turns: 1
      function_tool_path: ${oc.env:WORKSPACE}/quarl/tool/search_tool_fn.py
