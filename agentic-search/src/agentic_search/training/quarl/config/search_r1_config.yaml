hydra:
  searchpath:
    - file://${oc.env:WORKSPACE,./}/verl/verl/trainer/config


defaults:
  - ppo_trainer
  - _self_

trainer:
  device: npu              # Ascend: verl requests "NPU" Ray resources

algorithm:
  name: search_r1
  rollout_format: hermes
  chat_template: default
  adv_estimator: grpo

# verl 0.9.0 reward stack: config.reward drives RewardLoopManager.
# The EM scorer below follows the RawRewardFn convention
# (compute_score(data_source=..., solution_str=..., ground_truth=...)).
reward:
  num_workers: 8
  custom_reward_function:
    path: ${oc.env:WORKSPACE}/quarl/reward/score/qa_em.py
    name: compute_score
  reward_manager:
    source: importlib
    name: SearchR1RewardManager
    module:
      path: ${oc.env:WORKSPACE}/quarl/reward/manager/search_r1_reward_manager.py
      name: custom_reward_manager
  reward_model:
    enable: false

# Search-R1 trainer reads retriever.url for its batch_search calls
# (launch script overrides url with the real SEARCH_IP).
retriever:
  url: "http://localhost:8000/retrieve"
  topk: 3

# ---- agent loop (LLMGenerationManager / trainer reads these directly) ----
max_turns: 10              # agent loop turn limit
max_start_length: 4096     # start-prompt truncation (= max_prompt_length)
max_obs_length: 512        # observation truncation (search result text cap)
num_gpus: 4                # generation chunking (= trainer.n_gpus_per_node)
no_think_rl: false         # include <think> in RL (official default false)
do_search: true            # enable searching (core Search-R1 switch)
pad_token_id: 151643       # Qwen2.5 tokenizer pad id (change per model)

data:
  max_start_length: 4096
  dataloader_num_workers: 4

# Search-R1 uses verl's default data-source reward routing. For searchR1_*
# sources this resolves to search_r1_like_qa_em (exact-match reward).

actor_rollout_ref:
  actor:
    ppo_micro_batch_size_per_gpu: 1   # required when use_dynamic_bsz=False
  rollout:
    name: vllm
    multi_turn:
      max_assistant_turns: 10 # maximum assistant turns
      format: hermes
      enable: true # enable multi-turn rollout
      use_inference_chat_template: false # use inference chat template
      tokenization_sanity_check_mode: disable # disable tokenization sanity check
      tool_config_path: ${oc.env:WORKSPACE}/examples/tool_config/search_tool_config.yaml
      max_obs_length: 512
  agent:
    default_agent_loop: search_r1_agent
    agent_loop_config_path: null



diff_val_reward_fn_config:
  reward_model:
    reward_manager: naive_with_prompt
  data:
    reward_fn_key: data_source
  custom_reward_function:
    path: quarl/reward/score/search_eval_score.py
    name: compute_score


# Search_R1 specific configuration
search_r1:
  
  enable: false
  lang: zh # zh or en
  save_freq: 5
  validate_config: true # whether to validate config in RayPPOTrainer
  
  mini_epochs: 1 # number of mini-epochs per training iteration
  answer_pattern: "answer" # pattern to extract from generation output, "answer" or "question"
  
    
  # Solving phase settings (solver)  
  solver:
    enable: true
    do_sample: true
    temperature: 1

  
  # Reward-based dynamic sampling configuration
  # When enabled, will filter out proposer groups with zero reward variance and their corresponding solver trajectories
  # This helps ensure training data has sufficient reward diversity
  reward_dynamic_sampling:
    enable: false # Enable reward-based dynamic sampling
    metric: "seq_final_reward" # Metric to use for filtering: "seq_final_reward" or "seq_reward"
    max_num_gen_batches: 30 # Maximum number of generation batches to use for filtering
  
