hydra:
  searchpath:
    - file://${oc.env:WORKSPACE,./}/verl/verl/trainer/config


defaults:
  - ppo_trainer
  - _self_

trainer:
  device: npu              # Ascend: verl requests "NPU" Ray resources

algorithm:
  name: search_r1
  rollout_format: hermes
  chat_template: default
  adv_estimator: grpo

# verl 0.9.0 reward stack: config.reward drives RewardLoopManager.
# The EM scorer below follows the RawRewardFn convention
# (compute_score(data_source=..., solution_str=..., ground_truth=...)).
reward:
  num_workers: 8
  custom_reward_function:
    path: ${oc.env:WORKSPACE}/quarl/reward/score/qa_em.py
    name: compute_score
  reward_manager:
    source: importlib
    name: SearchR1RewardManager
    module:
      path: ${oc.env:WORKSPACE}/quarl/reward/manager/search_r1_reward_manager.py
      name: custom_reward_manager
  reward_model:
    enable: false

# Search-R1 trainer reads retriever.url for its batch_search calls
# (launch script overrides url with the real SEARCH_IP).
retriever:
  url: "http://localhost:8000/retrieve"
  topk: 3


data:
  max_start_length: 4096
  dataloader_num_workers: 4

actor_rollout_ref:
  actor:
    ppo_micro_batch_size_per_gpu: 1   # required when use_dynamic_bsz=False
    fsdp_config:
      model_dtype: bfloat16   # flash_attention_2 requires bf16/fp16; verl's fp32 default crashes
  ref:
    log_prob_micro_batch_size_per_gpu: 1   # ref (KL) model mirrors the actor's micro batch; null -> ActorConfig assert
    fsdp_config:
      model_dtype: bfloat16
  rollout:
    name: vllm
    prompt_length: 4096    # per-sample prompt cap (must match launcher data.max_prompt_length)
    response_length: 8192  # per-sample generation cap, multi-turn total (must match launcher data.max_response_length)
    max_model_len: 12288   # vLLM engine cap = prompt 4096 + response 8192
    log_prob_micro_batch_size_per_gpu: 1   # actor infer-mode (old-policy/ref logprob prefill) micro batch; required when use_dynamic_bsz=False
    trace:
      backend: mlflow   # per-sample trajectory tracing; view with: MLFLOW_TRACKING_URI=sqlite:///tmp/mlruns.db mlflow ui
      token2text: true  # decode tokens to text in traces
      max_samples_per_step_per_worker: 16   # cap trace volume per worker per step
    multi_turn:
      max_assistant_turns: 10 # maximum assistant turns
      max_parallel_calls: 3   # multiple <tool_call> blocks per round (one query each) execute in parallel
      max_tool_response_length: 512   # tool result truncation length (was SearchR1AgentLoop's max_obs_length=512)
      format: search   # dual-format parser: <tool_call>{json}</tool_call> + legacy <search>query</search>
      enable: true # enable multi-turn rollout
      use_inference_chat_template: false # use inference chat template
      tokenization_sanity_check_mode: disable # disable tokenization sanity check
      function_tool_path: ${oc.env:WORKSPACE}/quarl/tool/search_tool_fn.py
  agent:
    default_agent_loop: tool_agent   # verl stock ToolAgentLoop (JSON tool calling, search = only tool)
    agent_loop_config_path: null



diff_val_reward_fn_config:
  reward_model:
    reward_manager: naive_with_prompt
  data:
    reward_fn_key: data_source
  custom_reward_function:
    path: quarl/reward/score/search_eval_score.py
    name: compute_score
