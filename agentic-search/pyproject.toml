[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-search"
version = "0.1.0"
description = "Research implementations and experiments for agentic search."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyserini==1.4.0",
    "spacy==3.8.16",
    "numpy==1.26.4",
    "pyarrow==25.0.0",
    "verl",
]

[project.optional-dependencies]
retrieval-cpu = [
    "faiss-cpu>=1.8",
]
retrieval-gpu = ["faiss-gpu>=1.7.4"]

training-npu = [
    "torch==2.10.0",
    "transformers==5.5.4",
    "ray==2.48.0",
    # triton-ascend bundles triton for NPU; installing triton separately
    # overwrites files — install triton-ascend only
    # "triton-ascend==3.2.2 ; sys_platform == 'linux'",
]

training-cpu = [
    "torch==2.10.0",
    "transformers==5.5.4",
    "ray==2.48.0",
]


[tool.uv.sources]
verl = { path = "src/agentic_search/training/verl", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_search"]
